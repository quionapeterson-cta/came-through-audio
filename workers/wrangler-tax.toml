# Came Through Audio tax tables — a separate Worker (founder, 2026-11-25).
#
# It serves the year-keyed federal bracket table for the Financial Lab's Artist Tax Write-Off Estimator, so the
# app does not have to be rebuilt to pick up a new tax year. Its name is its own and deploying it changes no other
# Worker, binding or Email Routing rule.
#
# Two minutes to activate:
#   1. Deploy from the repo root:   npx wrangler deploy -c workers/wrangler-tax.toml
#   2. Put the printed URL in the app as VITE_CTA_TAX_TABLES_URL (Cloudflare → Settings → Variables, or .env for
#      local dev). Without it the Lab uses the tables bundled in src/lib/tax-brackets.ts, so nothing goes down.
#   3. Adding a year without redeploying works like this (set up 2026-11-25): the TAX_TABLES namespace below is bound and
#      the January 1 cron in [triggers] is on, so PUT a complete table to /tax/<year> instead of shipping a build.
#      Set TAX_ADMIN_TOKEN as a secret to switch that write path on (wrangler secret put TAX_ADMIN_TOKEN -c
#      workers/wrangler-tax.toml, or Workers → cta-tax-tables → Settings → Variables and Secrets). Until then the Worker
#      is read-only and serves the years bundled in src/lib/tax-brackets.ts.
#
# Check it without a browser:
#   curl -s https://cta-tax-tables.<your-subdomain>.workers.dev/tax | head -c 400
# It must answer with the years it holds. A call with another site's Origin must answer 403.

name = "cta-tax-tables"
main = "cta-tax-tables.ts"
compatibility_date = "2026-11-03"
workers_dev = true

[observability]
enabled = true

# January 1: re-read the years held and report whether the calendar has moved past the newest table.
[triggers]
crons = ["0 7 1 1 *"]

# Live updates (founder, 2026-11-25): the namespace created for this Worker, so a new tax year is stored rather than
# rebuilt. Until TAX_ADMIN_TOKEN is set as a secret the Worker is read-only and serves the years bundled in
# src/lib/tax-brackets.ts.
[[kv_namespaces]]
binding = "TAX_TABLES"
id = "26f02a6780734d5daeb0cb41636e542f"
