<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="An intake clipboard with a filled-in form, a pen and a folder of records">
  <rect width="480" height="320" fill="#F4F5F7"/>
  <circle cx="118" cy="248" r="64" fill="#004AAD" opacity="0.08"/>

  <!-- folder of records behind -->
  <path d="M292 78h64l10 14h62v168H292z" fill="#004AAD" opacity="0.22"/>
  <rect x="292" y="104" width="136" height="150" rx="8" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="2" opacity="0.95"/>

  <!-- clipboard -->
  <rect x="96" y="58" width="204" height="228" rx="14" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="4"/>
  <rect x="166" y="46" width="64" height="26" rx="8" fill="#0b0b0b"/>
  <rect x="180" y="54" width="36" height="8" rx="4" fill="#4D8CFF"/>

  <!-- form header -->
  <rect x="118" y="92" width="112" height="10" rx="5" fill="#0b0b0b"/>
  <rect x="118" y="110" width="70" height="6" rx="3" fill="#0b0b0b" opacity="0.35"/>

  <!-- fields -->
  <g fill="none" stroke="#0b0b0b" stroke-width="2.5" opacity="0.55">
    <rect x="118" y="132" width="160" height="20" rx="4"/>
    <rect x="118" y="162" width="160" height="20" rx="4"/>
    <rect x="118" y="192" width="160" height="20" rx="4"/>
  </g>
  <rect x="126" y="139" width="86" height="6" rx="3" fill="#0b0b0b" opacity="0.5"/>
  <rect x="126" y="169" width="64" height="6" rx="3" fill="#0b0b0b" opacity="0.5"/>
  <rect x="126" y="199" width="104" height="6" rx="3" fill="#004AAD"/>

  <!-- checkbox row -->
  <rect x="118" y="226" width="18" height="18" rx="4" fill="none" stroke="#0b0b0b" stroke-width="2.5"/>
  <path d="M122 235l5 6 10-12" stroke="#16794A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="146" y="231" width="104" height="7" rx="3" fill="#0b0b0b" opacity="0.45"/>
  <rect x="118" y="254" width="128" height="7" rx="3" fill="#0b0b0b" opacity="0.25"/>

  <!-- pen -->
  <g transform="rotate(28 330 190)">
    <rect x="322" y="120" width="16" height="126" rx="8" fill="#0b0b0b"/>
    <rect x="322" y="120" width="16" height="28" rx="8" fill="#4D8CFF"/>
    <path d="M322 246h16l-8 20z" fill="#0b0b0b"/>
    <path d="M327 259h6l-3 7z" fill="#E5E4E2"/>
  </g>
</svg>
