<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="A spine beside a ring divided into shares and a signed split sheet: the splits every agency divides your money by">
  <rect width="480" height="320" fill="#F4F5F7"/>
  <rect width="480" height="78" fill="#0b0b0b"/>
  <rect x="28" y="22" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="28" y="42" width="78" height="8" rx="4" fill="#4D8CFF"/>
  <rect x="392" y="24" width="60" height="8" rx="4" fill="#FFFFFF" opacity="0.35"/>

  <g>
    <rect x="196" y="88" width="56" height="20" rx="8" fill="#004AAD"/>
    <rect x="196" y="114" width="60" height="20" rx="8" fill="#4D8CFF"/>
    <rect x="196" y="140" width="64" height="20" rx="8" fill="#004AAD"/>
    <rect x="196" y="166" width="64" height="20" rx="8" fill="#4D8CFF"/>
    <rect x="196" y="192" width="64" height="20" rx="8" fill="#004AAD"/>
    <rect x="196" y="218" width="60" height="20" rx="8" fill="#4D8CFF"/>
    <rect x="196" y="244" width="56" height="20" rx="8" fill="#004AAD"/>
    <path d="M224 84v184" stroke="#0b0b0b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- the shares, as a ring divided up -->
  <g>
    <circle cx="398" cy="176" r="54" fill="none" stroke="#E5E4E2" stroke-width="18"/>
    <path d="M398 122a54 54 0 0 1 0 108" fill="none" stroke="#004AAD" stroke-width="18"/>
    <path d="M398 122a54 54 0 0 0 -49 76" fill="none" stroke="#4D8CFF" stroke-width="18"/>
    <circle cx="398" cy="176" r="20" fill="#F4F5F7"/>
    <path d="M388 176h20" stroke="#0b0b0b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- the signed sheet behind the numbers -->
  <g transform="rotate(-6 84 262)">
    <rect x="26" y="228" width="112" height="74" rx="6" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="3"/>
    <rect x="38" y="242" width="52" height="6" rx="3" fill="#004AAD"/>
    <path d="M38 266c14-10 22 8 34 0s14-8 24 2" fill="none" stroke="#16794A" stroke-width="4" stroke-linecap="round"/>
    <path d="M104 252l8 8 14-16" fill="none" stroke="#16794A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
