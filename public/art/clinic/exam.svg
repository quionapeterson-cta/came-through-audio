<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="The Royalty Health Doctor's examination desk with a white coat hanging behind it, carrying a music and money emoji, beside a vinyl record, headphones and a prescription">
  <rect width="480" height="320" fill="#F4F5F7"/>
  <rect x="0" y="0" width="480" height="106" fill="#0b0b0b"/>
  <rect x="24" y="26" width="128" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>
  <rect x="24" y="48" width="86" height="8" rx="4" fill="#4D8CFF"/>
  <rect x="24" y="66" width="196" height="6" rx="3" fill="#FFFFFF" opacity="0.35"/>
  <path d="M380 74c0-14 11-26 25-26s25 12 25 26" stroke="#4D8CFF" stroke-width="4" fill="none"/>

  <!-- the doctor's coat, hanging behind the desk -->
  <g>
    <rect x="395" y="104" width="20" height="9" rx="4" fill="#0b0b0b"/>
    <path d="M405 113v5" stroke="#0b0b0b" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M405 118c-8 0-15 2-21 5l-34 14c-6 3-9 8-9 15v74h128v-74c0-7-3-12-9-15l-34-14c-6-3-13-5-21-5z" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M405 118l-22 6 22 30 22-30z" fill="#E5E4E2" stroke="#0b0b0b" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M384 126l-17 12v26M426 126l17 12v26" fill="none" stroke="#0b0b0b" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
    <path d="M405 152v74" stroke="#0b0b0b" stroke-width="2.5" opacity="0.3"/>
    <circle cx="405" cy="168" r="3.5" fill="#0b0b0b" opacity="0.45"/>
    <circle cx="405" cy="194" r="3.5" fill="#0b0b0b" opacity="0.45"/>
    <!-- chest patch: a music note and a dollar sign -->
    <rect x="346" y="150" width="58" height="40" rx="9" fill="#E5E4E2" stroke="#0b0b0b" stroke-width="2.5"/>
    <text x="363" y="181" font-size="23" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🎵</text>
    <text x="390" y="181" font-size="23" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">💵</text>
    <path d="M352 196h32v18h-32zM426 196h32v18h-32z" fill="none" stroke="#0b0b0b" stroke-width="2.5" opacity="0.3" stroke-linejoin="round"/>
    <!-- the stethoscope, slung over the right shoulder -->
    <path d="M424 112c8-8 26-8 34 0" fill="none" stroke="#004AAD" stroke-width="5" stroke-linecap="round"/>
    <path d="M438 118c0 24-5 34-5 48 0 18 10 30 17 36" fill="none" stroke="#004AAD" stroke-width="6" stroke-linecap="round"/>
    <circle cx="452" cy="206" r="12" fill="#E5E4E2" stroke="#0b0b0b" stroke-width="3"/>
    <circle cx="452" cy="206" r="5" fill="#4D8CFF"/>
  </g>

  <!-- desk -->
  <rect x="0" y="224" width="480" height="18" fill="#0b0b0b"/>
  <rect x="0" y="242" width="480" height="78" fill="#004AAD" opacity="0.92"/>

  <!-- vinyl -->
  <circle cx="118" cy="196" r="46" fill="#0b0b0b"/>
  <circle cx="118" cy="196" r="34" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>
  <circle cx="118" cy="196" r="24" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.18"/>
  <circle cx="118" cy="196" r="12" fill="#4D8CFF"/>
  <circle cx="118" cy="196" r="3.5" fill="#0b0b0b"/>

  <!-- headphones -->
  <path d="M196 214a42 42 0 0 1 84 0" stroke="#0b0b0b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <rect x="186" y="206" width="16" height="30" rx="8" fill="#0b0b0b"/>
  <rect x="274" y="206" width="16" height="30" rx="8" fill="#0b0b0b"/>

  <!-- prescription pad -->
  <g transform="rotate(-6 300 250)">
    <rect x="238" y="230" width="150" height="76" rx="8" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="3"/>
    <path d="M252 252h44" stroke="#004AAD" stroke-width="6" stroke-linecap="round"/>
    <path d="M252 268h96" stroke="#0b0b0b" stroke-width="4" opacity="0.25" stroke-linecap="round"/>
    <path d="M252 282h74" stroke="#0b0b0b" stroke-width="4" opacity="0.25" stroke-linecap="round"/>
    <path d="M330 246l12 12 20-24" stroke="#16794A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- heartbeat line -->
  <path d="M24 200h56l14-26 16 52 18-32 14 6h58" stroke="#E0313F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
